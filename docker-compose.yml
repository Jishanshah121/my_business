# Local development stack.
#
# This exists so dev matches production regardless of what is installed on the
# host — the machine this was scaffolded on runs PHP 8.5 and Python 3.9, neither
# of which is what we deploy. Everything here is pinned.
#
#   docker compose up -d
#   docker compose exec php php bin/console migrate
#   docker compose exec php php bin/console db:seed
#
# The app is also runnable without Docker against a local MySQL — see README.

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]

  php:
    build:
      context: ./docker/php
    volumes:
      - ./:/var/www/html:cached
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MAIL_HOST: mailhog
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    command: --mysql-native-password=ON
    ports: ["3307:3306"]          # 3307 on the host: 3306 is often already taken
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-supplykaro}
      MYSQL_USER: ${DB_USERNAME:-supplykaro}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]

  # The AI service. Not needed until Phase 8 — start it with:
  #   docker compose --profile ai up -d
  python:
    profiles: ["ai"]
    build:
      context: ./docker/python
    ports: ["8001:8001"]
    volumes:
      - ./python-service:/app:cached
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["1025:1025", "8025:8025"]   # SMTP, web UI

  adminer:
    image: adminer:latest
    ports: ["8080:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  mysql-data:
  redis-data:
